<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARTER VERSE — Peer-to-Peer Value Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Cinzel:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050508;
            --teal: #00f2fe;
            --amber: #ff9900;
            --card-bg: rgba(18, 18, 28, 0.9);
            --border: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--bg);
            color: #f0f0f5;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .ambient-light {
            position: fixed;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(255, 153, 0, 0.05) 50%, transparent 70%);
            top: -20vw;
            left: 20vw;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 24px 6vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 3px;
            color: #fff;
            background: linear-gradient(135deg, #fff, var(--teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #a0a0b0;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--teal);
        }

        .cta-btn {
            background: linear-gradient(135deg, var(--teal), #4facfe);
            color: #000;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.7);
        }

        .hero {
            position: relative;
            height: 250vh;
        }

        .sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-heading {
            position: absolute;
            top: 15%;
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hero-heading h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .hero-heading p {
            color: #8a8a9e;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .assembly-stage {
            position: relative;
            width: 100%;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trade-card {
            position: absolute;
            width: 280px;
            height: 360px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            will-change: transform;
            transition: border-color 0.4s, box-shadow 0.4s;
        }

        .card-left {
            transform: translateX(-100vw) rotate(-25deg);
        }

        .card-right {
            transform: translateX(100vw) rotate(25deg);
        }

        .card-img {
            width: 100%;
            height: 60%;
            object-fit: cover;
            background: #151520;
        }

        .card-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-tag {
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .card-left .card-tag { color: var(--teal); }
        .card-right .card-tag { color: var(--amber); }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card-val {
            font-size: 0.85rem;
            color: #7a7a8c;
        }

        .match-glow {
            position: absolute;
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, var(--teal), #fff, var(--amber));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.5s, transform 0.5s;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 50px rgba(0, 242, 254, 0.6);
        }

        .match-glow.active {
            opacity: 1;
            transform: scale(1);
        }

        .value-bar-container {
            position: absolute;
            bottom: 12%;
            width: 320px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .value-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg
